name: Basic

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

  pull_request:

env:
  # Why 1.86.0, and not "stable".
  #
  # Releases are built by the cosmwasm/optimizer image (see Release.yml and the
  # `optimize` recipe in the justfile), and that image ships its own Rust. Today:
  #
  #     $ docker run --rm cosmwasm/optimizer:0.17.0 cargo --version
  #     1.86.0-x86_64-unknown-linux-musl
  #
  # The optimizer is therefore the real lower bound for this repository: code that
  # only compiles on something newer cannot be released, however green CI looks.
  # Pinning the check jobs to that exact version makes the cheap jobs fail first,
  # on the pull request, instead of at release time.
  #
  # This is not hypothetical. CI previously ran 1.88.0 and accepted `let` chains
  # (`if let Some(a) = x && let Some(b) = y`), stabilised in 1.88 for edition 2024.
  # Tests and clippy passed; `just optimize` then failed outright on five of them
  # with "`let` expressions in this position are unstable", and the contracts could
  # not be built for release at all.
  #
  # cosmwasm-check also fails to build on current stable (undefined symbol
  # `__rust_probestack`, from the wasmer version it pulls in), so the same pin is
  # what lets the artifacts job install it.
  #
  # When bumping the optimizer image, bump this in the same change: read the new
  # version with the command above, update OPTIMIZER_VERSION in Release.yml and the
  # justfile to match, and keep all three in step.
  RUST_VERSION: "1.86.0"

  OPTIMIZER_VERSION: "0.17.0"

  # A tag is mutable, so the digest is what actually pins the image. Keep this equal
  # to the value in Release.yml, which carries the full reasoning. Re-read it when
  # bumping the version:
  #     docker buildx imagetools inspect cosmwasm/optimizer:<version> --format '{{.Manifest.Digest}}'
  OPTIMIZER_DIGEST: "sha256:7e0b9229c1a4118d0c9a2af2e7f5d95a91f264c26a2ce5681c779926e74d7f85"

  # Validates that a built artifact is a real, instantiable CosmWasm contract.
  # Tracks the cosmwasm-std version in Cargo.toml.
  COSMWASM_CHECK_VERSION: "2.2.2"

# Nothing here publishes: these jobs only read the repository and upload a build
# artifact, which travels on the runtime token rather than this one. Declaring the
# scope explicitly drops every other permission the repository default would grant.
permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs rather than movable tags, for the
# reasons set out in Release.yml. Each pin is commented with the release it is, and the
# two workflows share these versions, so bump them together.
jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run unit tests
        run: cargo test --locked
        env:
          RUST_BACKTRACE: 1

  lints:
    name: Lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

  artifacts:
    name: Contract artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Build the way a release does, for two reasons.
      #
      # First, never `cargo build --workspace`: that unifies features across members,
      # so the `library` feature that asset-proxy and the marketplace request on their
      # dependencies also gets enabled on asset and asset-proxyable, compiling their
      # entry points out and yielding a ~20 KB artifact that cannot be instantiated.
      # The optimizer builds each package on its own, so it is immune to this.
      #
      # Second, rustc 1.82 and later emit wasm using the reference-types proposal,
      # which the CosmWasm VM rejects: cosmwasm-check reports "reference-types not
      # enabled: zero byte expected". `-C target-cpu=mvp` does not help, because the
      # precompiled std in the toolchain already carries it. What removes it is the
      # `wasm-opt` pass the optimizer runs, so raw `cargo build` output cannot be
      # validated at all and there is no point checking it here.
      - name: Cache optimizer state
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .optimizer/target
            .optimizer/registry
          key: optimizer-${{ env.OPTIMIZER_VERSION }}-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            optimizer-${{ env.OPTIMIZER_VERSION }}-${{ runner.os }}-

      - name: Build optimized artifacts
        run: |
          set -euo pipefail
          mkdir -p .optimizer/target .optimizer/registry
          docker run --rm \
            -v "$(pwd)":/code \
            -v "$(pwd)/.optimizer/target":/target \
            -v "$(pwd)/.optimizer/registry":/usr/local/cargo/registry \
            cosmwasm/optimizer:${{ env.OPTIMIZER_VERSION }}@${{ env.OPTIMIZER_DIGEST }}

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache cosmwasm-check
        id: check-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/cosmwasm-check
          key: cosmwasm-check-${{ env.COSMWASM_CHECK_VERSION }}-${{ env.RUST_VERSION }}-${{ runner.os }}

      - name: Install cosmwasm-check
        if: steps.check-cache.outputs.cache-hit != 'true'
        run: cargo install cosmwasm-check --version ${{ env.COSMWASM_CHECK_VERSION }} --locked

      - name: Validate artifacts
        run: |
          set -euo pipefail
          ls -la artifacts/
          cat artifacts/checksums.txt
          cosmwasm-check artifacts/*.wasm

      - name: Upload artifacts for inspection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: contracts
          path: |
            artifacts/*.wasm
            artifacts/checksums.txt
